name: Refresh dashboard data

# ─────────────────────────────────────────────────────────────────────────────
# Cron läuft in UTC. GitHub Actions kennt keine Zeitzonen.
#
# Gewünschte Auslösezeiten in MEZ/MESZ (Europe/Berlin):
#   17:30 MEZ  (UTC+1, Winter) = 16:30 UTC  →  cron: "30 16 * * 1-5"
#   17:30 MESZ (UTC+2, Sommer) = 15:30 UTC  →  cron: "30 15 * * 1-5"
#   22:00 MEZ  (UTC+1, Winter) = 21:00 UTC  →  cron: "0  21 * * 1-5"
#   22:00 MESZ (UTC+2, Sommer) = 20:00 UTC  →  cron: "0  20 * * 1-5"
#
# Lösung: Beide UTC-Zeiten eintragen → Workflow läuft immer pünktlich,
# egal ob Sommer- oder Winterzeit aktiv ist.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 17:30 MEZ  (Winterzeit, UTC+1)
    - cron: "30 16 * * 1-5"
    # 17:30 MESZ (Sommerzeit, UTC+2)
    - cron: "30 15 * * 1-5"
    # 22:00 MEZ  (Winterzeit, UTC+1)
    - cron: "0 21 * * 1-5"
    # 22:00 MESZ (Sommerzeit, UTC+2)
    - cron: "0 20 * * 1-5"

  workflow_dispatch:   # manueller Start jederzeit möglich

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data
        run: python scripts/build_data.py --out-dir data

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: refresh market data $(TZ='Europe/Berlin' date +'%Y-%m-%d %H:%M %Z')"
          git push
